<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>spazio</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
  @font-face { font-family:'Arimo'; src:url('fonts/arimo.woff2') format('woff2'); font-weight:400; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent;
      border:none; border-radius:0; letter-spacing:0; }
  html,body { background:#000; }
  body { color:#fff; font-family:'Arimo',Helvetica,Arial,sans-serif; min-height:100vh;
         padding:calc(24px + env(safe-area-inset-top)) 28px 40px; font-size:17px; }
  h1 { font-size:1.05rem; font-weight:400; margin-bottom:44px; }
  .screen { display:none; max-width:480px; margin:0 auto; }
  .screen.on { display:block; }
  .menu button { display:block; width:100%; text-align:left; background:#000; color:#fff;
                 font:inherit; font-size:1.7rem; padding:16px 0; cursor:pointer; }
  .back { background:#000; color:#fff; font:inherit; font-size:1.05rem; margin-bottom:28px; cursor:pointer; }
  #preview img, #preview video { width:100%; display:block; max-height:50vh; object-fit:contain; }
  #preview audio { width:100%; margin:8px 0; }
  textarea { width:100%; margin-top:26px; background:#000; color:#fff; font:inherit;
             font-size:1.05rem; min-height:64px; outline:none; caret-color:#fff; resize:none; }
  textarea::placeholder { color:#666; }
  .actions { margin-top:26px; }
  .actions button { display:block; width:100%; text-align:left; background:#000; color:#fff;
                    font:inherit; font-size:1.25rem; padding:13px 0; cursor:pointer; }
  .dim { color:#666; }
  #noteState { color:#666; font-size:.95rem; margin-top:10px; min-height:1.2em; }
  #recTime { font-size:3.4rem; font-weight:400; margin:60px 0; font-variant-numeric:tabular-nums; }
  #recLabel { animation:blink 1.2s step-end infinite; }
  @keyframes blink { 50% { opacity:0; } }
  #history { margin-top:64px; }
  #history .hd { color:#666; font-size:.9rem; margin-bottom:14px; }
  .item { padding:7px 0; font-size:1rem; color:#fff; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .item span { color:#666; }
  .ver { color:#333; font-size:.8rem; margin-top:40px; }
  #toast { position:fixed; left:0; right:0; bottom:0; background:#fff; color:#000; padding:16px 28px;
           font-size:1.05rem; transform:translateY(110%); transition:transform .22s; z-index:9; }
  #toast.show { transform:none; }
  input[type=file] { display:none; }
</style>
</head>
<body>

<div id="home" class="screen on">
  <h1>spazio</h1>
  <div class="menu">
    <button onclick="show('camMenu')">camera</button>
    <button onclick="galIn.click()">galleria</button>
    <button onclick="startRec('main')">voce</button>
    <button onclick="openNote()">note</button>
  </div>
  <div id="history"><div class="hd">recenti</div><div id="items"></div></div>
  <div class="ver">v4</div>
</div>

<div id="camMenu" class="screen">
  <button class="back" onclick="show('home')">&larr; indietro</button>
  <div class="menu">
    <button onclick="sysFoto.click()">foto</button>
    <button onclick="sysVideo.click()">video</button>
  </div>
</div>

<input type="file" id="sysFoto" accept="image/*" capture="environment">
<input type="file" id="sysVideo" accept="video/*" capture="environment">
<input type="file" id="galIn" accept="image/*,video/*">

<div id="recScreen" class="screen">
  <h1 id="recLabel">registrazione</h1>
  <div id="recTime">0:00</div>
  <div class="actions">
    <button onclick="stopRec(true)">fatto</button>
    <button class="dim" onclick="stopRec(false)">annulla</button>
  </div>
</div>

<div id="editorScreen" class="screen">
  <button class="back" onclick="reset()">&larr; indietro</button>
  <div id="preview"></div>
  <textarea id="caption" placeholder="didascalia…" rows="2"></textarea>
  <div id="noteState"></div>
  <div class="actions">
    <button id="noteBtn" onclick="toggleNote()">aggiungi nota vocale</button>
    <button onclick="salva()">salva</button>
    <button class="dim" onclick="reset()">annulla</button>
  </div>
</div>

<div id="toast"></div>

<script>
let current = null, voiceNote = null;
let rec = null, recChunks = [], recMode = null, recT0 = 0, recTimer = null;
const $ = id => document.getElementById(id);
const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());

function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on')); $(id).classList.add('on'); }
function setPreview(blob, kind){
  try {
    const url = URL.createObjectURL(blob);
    $('preview').innerHTML =
      kind==='foto'  ? `<img src="${url}">` :
      kind==='video' ? `<video src="${url}" controls playsinline preload="metadata"></video>` :
      kind==='voce'  ? `<audio src="${url}" controls></audio>` : '';
  } catch(e){ $('preview').innerHTML = '<div class="dim">anteprima non disponibile</div>'; }
}
function openEditor(kind){
  // "aggiungi nota vocale" solo per catture visive
  $('noteBtn').style.display = (kind==='foto'||kind==='video') ? 'block' : 'none';
  show('editorScreen');
}

/* ---------- camera di sistema + galleria ---------- */
sysFoto.onchange = e => pickFile(e, 'foto');
sysVideo.onchange = e => pickFile(e, 'video');
galIn.onchange  = e => pickFile(e, null);
function pickFile(e, kind){
  try {
    const f = e.target.files[0]; if(!f) return;
    if(!kind) kind = (f.type||'').startsWith('video') ? 'video' : 'foto';
    const ext = (f.name.match(/\.\w+$/) || [kind==='foto'?'.jpg':'.mp4'])[0];
    current = { blob:f, ext, kind };
    setPreview(f, kind);
    openEditor(kind);
  } catch(err){ toast('file non leggibile'); show('home'); }
  e.target.value = '';
}

/* ---------- note di testo ---------- */
function openNote(){
  current = { blob:null, ext:'.txt', kind:'nota' };
  $('preview').innerHTML = '';
  $('caption').placeholder = 'scrivi la nota…';
  openEditor('nota');
  $('caption').focus();
}

/* ---------- registratore vocale ---------- */
async function startRec(mode){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus'
               : MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '';
    rec = new MediaRecorder(stream, mime ? {mimeType:mime} : {});
    recChunks = []; recMode = mode;
    rec.ondataavailable = e => recChunks.push(e.data);
    rec._stream = stream;
    rec.start(250);
    recT0 = Date.now();
    show('recScreen');
    recTimer = setInterval(()=>{
      const s = Math.floor((Date.now()-recT0)/1000);
      $('recTime').textContent = Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
    },250);
  } catch(err){ toast('microfono non disponibile'); }
}
function stopRec(keep){
  clearInterval(recTimer);
  if(!rec) return;
  rec.onstop = () => {
    rec._stream.getTracks().forEach(t=>t.stop());
    const blob = new Blob(recChunks, {type: rec.mimeType || 'audio/webm'});
    const ext = (rec.mimeType||'').includes('mp4') ? '.m4a' : '.webm';
    if(!keep){ recMode==='main' ? show('home') : show('editorScreen'); rec=null; return; }
    if(recMode==='main'){
      current = { blob, ext, kind:'voce' };
      setPreview(blob,'voce');
      openEditor('voce');
    } else {
      voiceNote = { blob, ext };
      $('noteState').textContent = 'nota vocale allegata · ' + $('recTime').textContent;
      $('noteBtn').textContent = 'rimuovi nota vocale';
      show('editorScreen');
    }
    rec = null;
  };
  rec.stop();
}
function toggleNote(){
  if(voiceNote){ voiceNote=null; $('noteState').textContent=''; $('noteBtn').textContent='aggiungi nota vocale'; }
  else startRec('attach');
}

/* ---------- salvataggio ---------- */
function stamp(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
}
function blobToB64(blob){
  return new Promise((res,rej)=>{ const r=new FileReader();
    r.onload=()=>res(r.result.split(',')[1]); r.onerror=rej; r.readAsDataURL(blob); });
}
async function saveBlob(blob, name){
  if(NATIVE){
    const Filesystem = Capacitor.Plugins.Filesystem;
    const data = await blobToB64(blob);
    for(const directory of ['EXTERNAL_STORAGE','DOCUMENTS']){
      try {
        await Filesystem.writeFile({ path:'spazio-inbox/'+name, data, directory, recursive:true });
        return true;
      } catch(e){ }
    }
    throw new Error('storage');
  } else {
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},3000);
    return true;
  }
}
async function salva(){
  if(!current) return;
  const cap = $('caption').value.trim();
  if(current.kind==='nota' && !cap){ toast('scrivi qualcosa prima di salvare'); return; }
  const stem = 'es_'+stamp();
  try {
    if(current.blob) await saveBlob(current.blob, stem+current.ext);
    if(cap) await saveBlob(new Blob([cap+'\n\n['+current.kind+' · '+new Date().toISOString()+']'],{type:'text/plain'}), stem+'.txt');
    if(voiceNote) await saveBlob(voiceNote.blob, stem+'_nota'+voiceNote.ext);
    addHistory({stem, kind:current.kind, cap});
    toast('salvato — in coda per l\'inbox');
    reset();
  } catch(e){
    toast(NATIVE ? 'concedi "accesso a tutti i file" nelle impostazioni app' : 'salvataggio fallito');
  }
}

/* ---------- UI ---------- */
function reset(){
  current=null; voiceNote=null;
  $('caption').value=''; $('caption').placeholder='didascalia…';
  $('noteState').textContent=''; $('noteBtn').textContent='aggiungi nota vocale';
  $('preview').innerHTML=''; show('home');
}
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }

const KIND = { foto:'foto', video:'video', voce:'voce', nota:'nota' };
function addHistory(it){ const h=JSON.parse(localStorage.h||'[]'); h.unshift(it); localStorage.h=JSON.stringify(h.slice(0,20)); renderHistory(); }
function renderHistory(){
  const h=JSON.parse(localStorage.h||'[]');
  $('items').innerHTML = h.map(i=>
    `<div class="item">${KIND[i.kind]||'file'} <span>${i.stem.slice(3,11)} ${i.stem.slice(12,14)}:${i.stem.slice(14,16)}${i.cap?' · '+i.cap:''}</span></div>`
  ).join('') || '<div class="item"><span>ancora niente</span></div>';
}
renderHistory();

if(!NATIVE && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
